databases:
  - name: afemc-ci-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: afemc-ci-web
    runtime: python
    plan: free
    rootDir: afemc_ci
    # createcachetable (idempotente) crée la table du cache qui porte les
    # compteurs des limites de fréquence des formulaires publics.
    # charger_regles est idempotente (get_or_create) : sans danger à
    # rappeler à chaque déploiement, comme migrate — elle ne crée que les
    # règles absentes et ne touche jamais à celles ajustées dans l'admin. Sans cette ligne, la
    # table RegleRelance restait vide en production — aucune relance de
    # retard n'a jamais pu être envoyée depuis la mise en service, sans
    # aucune erreur visible (RegleRelance.applicable() retourne simplement
    # None si aucune règle n'existe).
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py createcachetable && python manage.py charger_regles"
    # --timeout 90 : marge de sécurité pour /taches/executer/, qui peut
    # traiter plusieurs notifications en un seul appel HTTP.
    startCommand: "gunicorn config.wsgi:application --timeout 90"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.13"   # runtime.txt n'était visiblement pas pris en compte : Render
                           # utilisait Python 3.14, incompatible avec Django 5.0 (AttributeError
                           # dans template/context.py — bug connu de cette combinaison de versions)
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod   # manage.py utilise dev.py par défaut sinon,
                                       # y compris pendant collectstatic au build
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: CRON_SECRET
        generateValue: true    # jeton attendu par /taches/executer/ (§ 7 du README)
      - key: SUPERUSER_BOOTSTRAP_EMAIL
        sync: false             # email du premier compte administrateur (§ 7 du README)
      - key: SUPERUSER_BOOTSTRAP_PASSWORD
        sync: false             # mot de passe correspondant
      - key: POSTGRES_DB
        fromDatabase: {name: afemc-ci-db, property: database}
      - key: POSTGRES_USER
        fromDatabase: {name: afemc-ci-db, property: user}
      - key: POSTGRES_PASSWORD
        fromDatabase: {name: afemc-ci-db, property: password}
      - key: POSTGRES_HOST
        fromDatabase: {name: afemc-ci-db, property: host}
      - key: POSTGRES_PORT
        fromDatabase: {name: afemc-ci-db, property: port}
      - key: BREVO_API_KEY
        sync: false          # clé API v3 Brevo (Paramètres > Clés API) — jamais dans ce fichier ;
                              # renseignée manuellement dans le tableau de bord Render (secret).
                              # Envoi via l'API HTTP (443), pas SMTP (587) : voir § 7 du README.
      - key: EMAIL_EXPEDITEUR
        sync: false          # adresse vérifiée dans Brevo
      - key: COTISATION_MONTANT_DEFAUT
        value: "25000"

# Pas de worker Celery ici : les Background Workers ne sont pas disponibles
# sur le plan gratuit Render. La détection des retards et l'acheminement des
# notifications sont déclenchés à la place par un appel HTTP planifié
# (GitHub Actions, .github/workflows/cron.yml) vers /taches/executer/,
# protégé par CRON_SECRET — voir § 7 du README.
