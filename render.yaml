databases:
  - name: afemc-ci-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: redis
    name: afemc-ci-redis
    plan: free
    ipAllowList: []

  - type: web
    name: afemc-ci-web
    runtime: python
    plan: free
    rootDir: afemc_ci
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: POSTGRES_DB
        fromDatabase: {name: afemc-ci-db, property: database}
      - key: POSTGRES_USER
        fromDatabase: {name: afemc-ci-db, property: user}
      - key: POSTGRES_PASSWORD
        fromDatabase: {name: afemc-ci-db, property: password}
      - key: POSTGRES_HOST
        fromDatabase: {name: afemc-ci-db, property: host}
      - key: POSTGRES_PORT
        fromDatabase: {name: afemc-ci-db, property: port}
      - key: CELERY_BROKER_URL
        fromService: {type: redis, name: afemc-ci-redis, property: connectionString}
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false          # renseigné manuellement dans le tableau de bord Render (secret)
      - key: EMAIL_HOST_PASSWORD
        sync: false          # idem — clé SMTP Brevo, jamais dans ce fichier
      - key: EMAIL_EXPEDITEUR
        sync: false          # adresse vérifiée dans Brevo
      - key: COTISATION_MONTANT_DEFAUT
        value: "25000"

  - type: worker
    name: afemc-ci-worker
    runtime: python
    plan: free
    rootDir: afemc_ci
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -B --loglevel=info"
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService: {type: web, name: afemc-ci-web, envVarKey: DJANGO_SECRET_KEY}
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: POSTGRES_DB
        fromDatabase: {name: afemc-ci-db, property: database}
      - key: POSTGRES_USER
        fromDatabase: {name: afemc-ci-db, property: user}
      - key: POSTGRES_PASSWORD
        fromDatabase: {name: afemc-ci-db, property: password}
      - key: POSTGRES_HOST
        fromDatabase: {name: afemc-ci-db, property: host}
      - key: POSTGRES_PORT
        fromDatabase: {name: afemc-ci-db, property: port}
      - key: CELERY_BROKER_URL
        fromService: {type: redis, name: afemc-ci-redis, property: connectionString}
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_EXPEDITEUR
        sync: false
      - key: COTISATION_MONTANT_DEFAUT
        value: "25000"
